# ==============================
# Root logger configuration
# ==============================
rootLogger.level = debug
rootLogger.appenderRefs = [console, file]
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

# ==============================
# Console Appender
# ==============================
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = \u001B[37m[\u001B[30m%d{HH:mm:ss}\u001B[37m] \u001B[34m[%-5level]\u001B[37m \u001B[32m%logger{36} \u001B[37m-\u001B[37m \u001B[34m%msg%n\u001B[0m

# ==============================
# File Appender
# ==============================
appender.file.type = File
appender.file.name = File
# Write file in project root
appender.file.fileName = automation.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = \u001B[37m[%d{yyyy-MM-dd HH:mm:ss}] \u001B[34m[%-5level]\u001B[37m \u001B[32m%logger{36} \u001B[37m-\u001B[37m \u001B[32m%msg%n\u001B[0m