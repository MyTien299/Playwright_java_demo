name: Nightly Test Execution

on:
  schedule:
    # Run every night at 11 PM UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '24'

jobs:
  nightly-tests:
    name: Nightly Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright Browsers
        run: |
          mvn exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install"

      - name: Run Full Test Suite
        run: |
          mvn clean test \
            -Dheadless=true \
            -Dparallel=true \
            -DthreadCount=8
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report -DhistoryDir=target/allure-history

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-results
          path: target/allure-results
          retention-days: 90

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-report
          path: target/allure-report
          retention-days: 90

      - name: Deploy Nightly Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report
          destination_dir: nightly/${{ github.run_number }}

      - name: Send Nightly Test Summary
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🌙 Nightly Test Execution #${{ github.run_number }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Nightly Test Report*\nStatus: ${{ job.status }}\nTime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*View Report:* <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nightly/${{ github.run_number }}/|Allure Report>"
                  }
                }
              ]
            }
