name: Release & Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

env:
  JAVA_VERSION: '24'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Verify Build Artifacts
        run: |
          if [ ! -f "target/Playwright_demo-1.0-SNAPSHOT.jar" ]; then
            echo "❌ Build artifact not found"
            exit 1
          fi
          echo "✅ Build artifacts verified"

  test:
    name: Run Full Test Suite
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright Browsers
        run: |
          mvn exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install"

      - name: Run Full Test Suite
        run: |
          mvn clean test \
            -Dheadless=true \
            -Dparallel=true \
            -DthreadCount=8
        continue-on-error: false

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report -DhistoryDir=target/allure-history

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-allure-results
          path: target/allure-results
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: release-allure-results
          path: allure-results

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name }}
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          
          cat > release_notes.md << EOF
          # Release $VERSION
          
          **Build Information:**
          - Commit: $COMMIT_HASH
          - Total Commits: $COMMIT_COUNT
          - Release Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ## 🧪 Test Results
          - All tests passed ✅
          - Full test suite executed
          - Allure reports generated
          
          ## 📦 Artifacts
          - Build artifacts available in release
          - Test reports available in GitHub Pages
          
          ## 🔗 Resources
          - [View Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_number }}/)
          
          ---
          
          **Release created by:** GitHub Actions
          **Workflow:** ${{ github.workflow }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-report:
    name: Deploy Release Report
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: release-allure-results
          path: allure-results

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: releases/${{ github.ref_name }}

  notify-release:
    name: Notify Release
    needs: [ create-release, deploy-report ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Slack Notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚀 New Release: ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Release Published"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n✅ Success"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Links:*\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release> | <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/releases/${{ github.ref_name }}/|View Report>"
                  }
                }
              ]
            }

      - name: Send Email Notification
        if: secrets.EMAIL_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Release ${{ github.ref_name }} Published Successfully"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: "GitHub Actions <noreply@github.com>"
          body: |
            Release Published Successfully!
            
            Version: ${{ github.ref_name }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            
            All tests passed ✅
            
            View Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            View Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/releases/${{ github.ref_name }}/
